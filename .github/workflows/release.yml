name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect signing configuration
        id: signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          for variable in \
            MACOS_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            DEVELOPER_ID_APPLICATION \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
            echo "require_notarization=1" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing and Apple notarization are enabled."
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "require_notarization=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple release secrets are incomplete. Publishing an ad-hoc signed build."
            {
              echo "### Ad-hoc signed release"
              echo
              echo "Apple release secrets are incomplete, so this run skips Developer ID signing and notarization."
              echo "Missing secret names: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'notarized'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/codex-usage-bar.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" \
            "$keychain_path"

      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_version="$INPUT_VERSION"
          else
            release_version="${REF_NAME#v}"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Run parser checks
        run: swift run ParserChecks

      - name: Test app updates
        run: swift run UpdateChecks

      - name: Build universal app
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.mode == 'notarized' && secrets.DEVELOPER_ID_APPLICATION || '-' }}
        run: ./Scripts/build-app.sh

      - name: Package release
        env:
          REQUIRE_NOTARIZATION: ${{ steps.signing.outputs.require_notarization }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./Scripts/package-release.sh

      - name: Test packaged app updates
        run: swift run UpdateChecks --app dist/CodexUsageBar.app

      - name: Verify release
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          executable="dist/CodexUsageBar.app/Contents/MacOS/CodexUsageBar"
          architectures="$(lipo -archs "$executable")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]
          helper_architectures="$(lipo -archs dist/CodexUsageBar.app/Contents/Helpers/UpdateInstaller)"
          [[ "$helper_architectures" == *arm64* ]]
          [[ "$helper_architectures" == *x86_64* ]]
          codesign --verify --deep --strict --verbose=2 dist/CodexUsageBar.app
          if [[ "$SIGNING_MODE" == "notarized" ]]; then
            spctl --assess --type execute --verbose=2 dist/CodexUsageBar.app
            xcrun stapler validate dist/CodexUsageBar.app
          else
            codesign -dv --verbose=4 dist/CodexUsageBar.app 2>&1 | grep "Signature=adhoc"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          archive="dist/CodexUsageBar-v$RELEASE_VERSION-macOS-universal.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$archive" \
              "$archive.sha256" \
              --clobber
          elif [[ "$SIGNING_MODE" == "notarized" ]]; then
            gh release create "$RELEASE_TAG" \
              "$archive" \
              "$archive.sha256" \
              --title "Codex Usage Bar $RELEASE_TAG" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" \
              "$archive" \
              "$archive.sha256" \
              --title "Codex Usage Bar $RELEASE_TAG" \
              --generate-notes \
              --notes "This build is ad-hoc signed and not notarized. If macOS blocks it, open System Settings > Privacy & Security and choose Open Anyway after attempting to launch the app from Applications."
          fi
